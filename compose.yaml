# Gideon Transcribe: the whole stack, as one Compose project named
# `transcribe`.
#
# One `docker compose up -d` at the Install home brings up the app and the
# WhisperX service together. The service is include-d from its own folder
# rather than written out here, because it is a product of its own and still
# runs on its own for a second Consumer or a test bench.
#
# Every value an office supplies is in .env beside this file, and every secret
# is a file under secrets/. `./transcribe install` writes both.

name: transcribe

include:
  - path: whisperx-service/compose.yaml
    env_file: whisperx-service/.env

services:
  caddy:
    # The front door. It publishes the one port this stack has, and it is the
    # only thing that talks to the app.
    image: caddy:2.11-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    user: "${APP_UID:?set APP_UID in .env}:${APP_GID:?set APP_GID in .env}"
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_HOSTNAME: "${APP_HOSTNAME:?set APP_HOSTNAME in .env}"
      # Empty would be a Caddyfile error rather than a wide-open door, so an
      # office that means everyone says so in full.
      ALLOWED_CLIENT_CIDRS: "${ALLOWED_CLIENT_CIDRS:-0.0.0.0/0 ::/0}"
      TZ: "${TZ:-UTC}"
    ports:
      # The address as well as the port: the server's own LAN address keeps
      # this off every other interface the machine has.
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The office's certificate and its key, placed by hand before the first
      # start. Caddy reads them once, so a renewed certificate needs
      # `docker compose restart caddy`.
      - ./tls:/etc/caddy/tls:ro
      # The working folder, read-only: Caddy serves Playback copies, waveforms,
      # and Clips straight off it. The uploaded bytes are in the same tree and
      # are never served, which the app's own answer enforces.
      - "${APP_DATA_DIR}/scratch:/srv/scratch:ro"
      - "${APP_DATA_DIR}/cases:/srv/cases:ro"
      # Caddy keeps nothing that matters, but it wants somewhere to write.
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - transcribe
    logging:
      driver: journald

  postgres:
    image: postgres:18-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    # Its own user, not the app's: the database owns its files.
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-transcribe}"
      POSTGRES_USER: "${POSTGRES_USER:-transcribe}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: "${TZ:-UTC}"
    secrets:
      - postgres_password
    volumes:
      - "${APP_DATA_DIR:?set APP_DATA_DIR in .env}/postgres:/var/lib/postgresql/data"
    # Enough for a database that holds settings, users, the audit log, prompt
    # templates, and one Login session's text.
    command: >
      postgres
      -c shared_buffers=1GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transcribe} -d ${POSTGRES_DB:-transcribe}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - transcribe
    logging:
      driver: journald

  app:
    # The tag follows the Release this checkout is at, which ./transcribe
    # upgrade writes into .env before it builds or pulls. It used to be a
    # fixed v0.1.0, so every Release built an image called v0.1.0 whatever it
    # actually contained. Nothing had been published, so the pull failed and
    # it built from source and worked by accident; but the day a v0.1.0 image
    # reached the registry, every upgrade after it would have pulled that and
    # run last year's code under this year's checkout, silently.
    #
    # "dev" is for a checkout that is not at a Release, where there is nothing
    # to pull and building from source is the only right answer.
    image: ghcr.io/tnmd-fdo/gideon-transcribe-app:${RELEASE_TAG:-dev}
    build:
      # The repository root, not app/, so the build can reach the guides in
      # docs/ (ADR 0012). The root .dockerignore keeps the office's .env and
      # secrets out of the context.
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    user: "${APP_UID:?set APP_UID in .env}:${APP_GID:?set APP_GID in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    environment: &app-environment
      APP_HOSTNAME: "${APP_HOSTNAME:?set APP_HOSTNAME in .env}"
      # The port the office reaches the app on, so the app can ask itself the
      # questions a browser asks. It is not 443: another reverse proxy on the
      # server may already own that, and the app's address carries the port.
      HTTPS_PORT: "${HTTPS_PORT:-8443}"
      APP_DATA_DIR: /srv/data
      POSTGRES_HOST: postgres
      POSTGRES_DB: "${POSTGRES_DB:-transcribe}"
      # The account that made the database, used once at start to make the
      # app's own role, and never to serve a request.
      POSTGRES_USER: "${POSTGRES_USER:-transcribe}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      WHISPERX_URL: "${WHISPERX_URL:-http://whisperx:8000}"
      WHISPERX_TOKEN_FILE: /run/secrets/whisperx_consumer_token
      TZ: "${TZ:-UTC}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # How much of the server the media work may take. Both were in
      # .env.example's shape and in the specification and neither reached a
      # container: the entrypoint read MEDIA_CONCURRENT_JOBS and always found
      # nothing, so an office setting it got the default and no warning, and
      # nothing read MEDIA_THREADS_PER_JOB at all, so every ffmpeg took every
      # core on the machine.
      MEDIA_THREADS_PER_JOB: "${MEDIA_THREADS_PER_JOB:-8}"
      MEDIA_CONCURRENT_JOBS: "${MEDIA_CONCURRENT_JOBS:-4}"
      # The engine's token file, for llm-worker. Named here so the status page
      # can say which file it is; the file itself is a Compose secret.
      LLM_API_TOKEN_FILE: "${LLM_API_TOKEN_FILE:-./secrets/llm_api_token}"
      # What the Admin panel's installation page reports back. An office fills
      # these in and expects to see them there; without them the page says
      # "not set" to a correctly configured server.
      BIND_ADDRESS: "${BIND_ADDRESS:-0.0.0.0}"
      ALLOWED_CLIENT_CIDRS: "${ALLOWED_CLIENT_CIDRS:-}"
      LLM_NETWORK: "${LLM_NETWORK:-transcribe-llm}"
      COMPOSE_PROFILES: "${COMPOSE_PROFILES:-}"
      # The upload sidecar, which the status page asks whether it is alive.
      # A fixed address on this stack's own network, not an office fact.
      TUSD_URL: "http://tusd:1080"
      # The Release this is running, so the panel and the audit log can say so
      # rather than guessing. Written by ./transcribe upgrade.
      RELEASE_TAG: "${RELEASE_TAG:-}"
      # The office directory. Every value is this office's own and lives in
      # .env; the bind password is a secret file and the CA root is mounted
      # read-only, so neither is ever an environment value.
      LDAP_ENABLED: "${LDAP_ENABLED:-true}"
      LDAP_SERVER_URI: "${LDAP_SERVER_URI:-}"
      LDAP_CA_FILE: /run/secrets/ldap_ca_root
      LDAP_BIND_USER: "${LDAP_BIND_USER:-}"
      LDAP_BIND_PASSWORD_FILE: /run/secrets/ldap_bind_password
      LDAP_SEARCH_BASE: "${LDAP_SEARCH_BASE:-}"
      LDAP_SIGNIN_GROUP: "${LDAP_SIGNIN_GROUP:-}"
      LDAP_ADMIN_GROUP: "${LDAP_ADMIN_GROUP:-}"
    secrets:
      - postgres_password
      - django_secret_key
      - whisperx_consumer_token
      - ldap_bind_password
      - ldap_ca_root
    volumes:
      - "${APP_DATA_DIR}:/srv/data"
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=5).status == 200 else 1)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      # The app reaches the WhisperX service on its own network, and nothing
      # else on it.
      - transcribe
      - whisperx
    logging:
      driver: journald

  tusd:
    # Resumable uploads, straight to disk. Bytes never pass through Python:
    # the sidecar takes them and asks the app two questions about each one.
    image: tusproject/tusd:v2.9@sha256:9c61565fccd2689b052aa78e52d9558f309e98f6320960746f225d2fd73a35e3
    restart: unless-stopped
    user: "${APP_UID:?set APP_UID in .env}:${APP_GID:?set APP_GID in .env}"
    depends_on:
      app:
        condition: service_healthy
    command:
      - "-behind-proxy"
      - "-base-path=/files/"
      - "-upload-dir=/srv/data/uploads"
      - "-hooks-http=http://app:8000/upload-hook/"
      - "-hooks-enabled-events=pre-create,post-finish"
      - "-port=1080"
    volumes:
      - "${APP_DATA_DIR}:/srv/data"
    expose:
      - "1080"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - transcribe
    logging:
      driver: journald

  media-worker:
    # ffmpeg and audiowaveform: hashing, probing, Sides, the audio the service
    # is sent, the Playback copy, the waveform, and Clip renders. CPU only; no
    # container built from the app image ever sees a GPU.
    image: ghcr.io/tnmd-fdo/gideon-transcribe-app:${RELEASE_TAG:-dev}
    build:
      # The repository root, not app/, so the build can reach the guides in
      # docs/ (ADR 0012). The root .dockerignore keeps the office's .env and
      # secrets out of the context.
      context: .
      dockerfile: app/Dockerfile
    command: ["media-worker"]
    restart: unless-stopped
    user: "${APP_UID:?set APP_UID in .env}:${APP_GID:?set APP_GID in .env}"
    depends_on:
      app:
        condition: service_healthy
    environment: *app-environment
    secrets:
      - postgres_password
      - django_secret_key
      - whisperx_consumer_token
      - ldap_bind_password
      - ldap_ca_root
    volumes:
      - "${APP_DATA_DIR}:/srv/data"
    healthcheck:
      test: ["CMD", "python", "manage.py", "procrastinate", "healthchecks"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8G
          # Four media jobs of eight ffmpeg threads each, and room to spare.
          # The only CPU cap in the stack: transcodes are the one thing here
          # that will take every core they are given.
          cpus: "40"
    networks:
      - transcribe
    logging:
      driver: journald

  worker:
    # The queue and the schedules: handing Runs to the WhisperX service,
    # polling it, merging results, and the nightly sweeps.
    image: ghcr.io/tnmd-fdo/gideon-transcribe-app:${RELEASE_TAG:-dev}
    build:
      # The repository root, not app/, so the build can reach the guides in
      # docs/ (ADR 0012). The root .dockerignore keeps the office's .env and
      # secrets out of the context.
      context: .
      dockerfile: app/Dockerfile
    command: ["worker"]
    restart: unless-stopped
    user: "${APP_UID:?set APP_UID in .env}:${APP_GID:?set APP_GID in .env}"
    depends_on:
      app:
        condition: service_healthy
    environment: *app-environment
    secrets:
      - postgres_password
      - django_secret_key
      - whisperx_consumer_token
      - ldap_bind_password
      - ldap_ca_root
    volumes:
      - "${APP_DATA_DIR}:/srv/data"
    healthcheck:
      test: ["CMD", "python", "manage.py", "procrastinate", "healthchecks"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8G
    networks:
      - transcribe
      - whisperx
    logging:
      driver: journald

secrets:
  postgres_password:
    file: "${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}"
  django_secret_key:
    file: "${DJANGO_SECRET_KEY_FILE:-./secrets/django_secret_key}"
  whisperx_consumer_token:
    file: "${WHISPERX_TOKEN_FILE:-./secrets/whisperx_consumer_token}"
  ldap_bind_password:
    file: "${LDAP_BIND_PASSWORD_FILE:-./secrets/ldap_bind_password}"
  # The office CA root, as a secret rather than a mounted file: a secret whose
  # file is missing stops the stack with a clear message, where a missing bind
  # mount would quietly become an empty folder and fail at the first sign-in.
  # An empty file means the system trust store, which is what an office with a
  # public certificate authority has.
  ldap_ca_root:
    file: "${LDAP_CA_FILE:-./ca/office-root.pem}"

volumes:
  caddy-data:
  caddy-config:

networks:
  transcribe:
    name: transcribe
