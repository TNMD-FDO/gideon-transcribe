# Every model the service uses, pinned.
#
# `pull` fetches exactly what is listed here, checks each download against its
# pin, and reports. After the pull the service runs offline, so anything not
# listed here is not available to a job: a language whose alignment model was
# not pulled completes with segment timing only (until service 0.5.0 a job in
# such a language made one fetch attempt at run time; it no longer does).
#
# The revisions and checksums below are the ones the specification left to the
# build. The diarization model's revision was fixed by the planning tickets;
# the rest were written down from what the first pull fetched on 2026-09-03, so
# that every office afterwards gets the same files.

# The two models a job may name. The English-only distil model is deliberately
# absent: it cannot translate.
asr:
  large-v3:
    repository: Systran/faster-whisper-large-v3
    revision: edaa852ec7e145841d8ffdb056a99866b5f0a478
    licence: MIT
    size_gb: 3.09
  large-v3-turbo:
    repository: mobiuslabsgmbh/faster-whisper-large-v3-turbo
    revision: 0a363e9161cbc7ed1431c9597a8ceaf0c4f78fcf
    licence: MIT
    size_gb: 1.62
    # The default since the Phase 1 benchmark gate, 2026-09-03: about 40 per
    # cent faster, 4 GB less video memory, within 3 per cent of large-v3 on
    # words found in 13 of 14 sample recordings, and right about the language
    # on the one recording large-v3 misheard. Confirmed by a reader against
    # both models' transcripts of a narrowband jail call and an office call,
    # which is the test the specification asks for: a word count says nothing
    # about whether a name or a number is right.
    default: true

# One model, one licence acceptance, one token. This repository carries its own
# segmentation, embedding, and plda files, so there is no second gated
# repository to accept, as pyannote 3.1 had.
diarization:
  repository: pyannote/speaker-diarization-community-1
  revision: 3533c8cf8e369892e6b79ff1bf80f7b0286a54ee
  licence: CC-BY-4.0
  gated: true
  size_gb: 0.033

# The diarizer container's model (Phase 5 chapter 4, ADR 0014): Nemotron 3
# Diarization, open weights, no gate and no token. Served by the `diarizer`
# service in the Compose file, which reads this snapshot offline. The
# revision was the repository's head when the probe of 2026-09-24 ran and the
# chapter was built; it moves only through a research ticket, like every pin.
diarizer:
  repository: nvidia/Nemotron-3-Diarization
  revision: f667ed73aee57d40cc39428eb768b4fd87a0a29e
  licence: OpenMDW-1.1
  gated: false
  size_gb: 0.45

# The voices (ADR 0021, the voice plan's second release): NVIDIA's TitaNet-
# large speaker verification model, loaded in the diarizer container beside
# Nemotron through the same pinned NeMo. One file of the repository is
# fetched; its sample recordings are not. The revision is the repository's
# only commit (2023-11-14); the measurement that chose the model is
# `docs/research/speaker-verification.md`. CC-BY-4.0, attributed in the
# third-party licences file.
voices:
  repository: nvidia/speakerverification_en_titanet_large
  revision: 0dc382f40121a5fbd34db10a2bb04d826c2be6a8
  file: speakerverification_en_titanet_large.nemo
  licence: CC-BY-4.0
  gated: false
  size_gb: 0.10

# The recogniser container's models (Phase 1 chapter 7, ADR 0025): Qwen3-ASR
# 1.7B, which writes the words under the Qwen3-ASR recogniser choice, and its
# forced aligner, which times them. Open weights, Apache 2.0, no gate and no
# token. Served by the `recogniser` service in the Compose file, which reads
# the two snapshots offline and loads them on the first job that asks. The
# revisions are the repositories' heads on 2026-10-26, the day of the trial
# (docs/research/qwen3-asr.md); they move only through a research ticket.
recogniser:
  asr:
    repository: Qwen/Qwen3-ASR-1.7B
    revision: 7278e1e70fe206f11671096ffdd38061171dd6e5
    licence: Apache-2.0
    gated: false
    size_gb: 4.0
  aligner:
    repository: Qwen/Qwen3-ForcedAligner-0.6B
    revision: c7cbfc2048c462b0d63a45797104fc9db3ad62b7
    licence: Apache-2.0
    gated: false
    size_gb: 1.3

# The alignment models for the languages in WHISPERX_ALIGN_LANGUAGES, so that
# those languages are aligned offline from the first run. Both come from
# torchaudio's own bundles, which torch fetches by URL rather than from a
# repository, so the pin is the file's checksum. A language whose alignment
# model comes from HuggingFace would be pinned by revision instead.
alignment:
  en:
    source: torchaudio
    url: https://download.pytorch.org/torchaudio/models/wav2vec2_fairseq_base_ls960_asr_ls960.pth
    sha256: 488fd4f16de84438ffc945334278c1b9fb9b7159a806c1080b16111a958c945d
  es:
    source: torchaudio
    url: https://download.pytorch.org/torchaudio/models/wav2vec2_voxpopuli_base_10k_asr_es.pt
    sha256: 272a92b156b78e697e6c7cf7c64f274250a36d0047440e27a895a377d3af818f
