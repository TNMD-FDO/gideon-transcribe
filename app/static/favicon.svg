<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The brand mark (v1.173.0): a voice of six bars in a ring, the Sixth
       Amendment counted rather than drawn. Drawn rather than fetched, so it
       costs one small file and no licence. The browser's own light or dark
       chrome picks the colour, since the ring has no tile behind it. -->
  <style>
    .mark { stroke: #0f5e86; }
    @media (prefers-color-scheme: dark) { .mark { stroke: #5fadd8; } }
  </style>
  <g class="mark" fill="none" stroke-width="2.3" stroke-linecap="round">
    <circle cx="16" cy="16" r="13.25"/>
    <path d="M7.6 13.6v4.8M11 11.2v9.6M14.4 9v14M17.8 8v16M21.2 11v10M24.6 13.4v5.2"/>
  </g>
</svg>
