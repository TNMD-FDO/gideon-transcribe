{% extends "panel/base.html" %}
{% load static %}
{% block title %}Queue{% endblock %}

{% block panel %}
  <h1>Queue</h1>
  <p class="lead">
    Every job, newest first. There is no priority and no pause: a job is in
    the line, running, or ended.
  </p>
  <div class="card">
    <table class="tbl">
      <thead>
        <tr>
          <th>User</th><th>Recording</th><th>Batch</th><th>Length</th>
          <th>State</th><th>Step</th><th></th>
        </tr>
      </thead>
      <tbody id="jobs"></tbody>
    </table>
  </div>
  <script src="{% static 'panel-queue.js' %}"></script>
{% endblock %}
