<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The typefaces the Word exports name, for the PDF maker (Phase 14 chapter 1;
  docs/research/pdf-maker.md). Neither Calibri nor Consolas is free, so
  neither is in the image. Carlito is drawn to Calibri's widths, so a PDF's
  lines and pages break where Word breaks them; DejaVu Sans Mono stands in
  for Consolas, which has no free face of the same widths.
-->
<fontconfig>
  <alias binding="same">
    <family>Calibri</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias binding="same">
    <family>Consolas</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
