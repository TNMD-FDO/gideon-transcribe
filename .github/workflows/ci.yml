name: CI

# Lint, unit tests, compose validation, and a secret scan, on every push and
# pull request, on GitHub's hosted runners (specification, Phase 1, chapter 2,
# "Access, branches, and CI"). No self-hosted runner is used, here or anywhere,
# including the one the office runs on its own server.
#
# Nothing here needs a GPU. The WhisperX service is written so that everything
# except its model process runs without torch, and the app is tested against a
# real PostgreSQL, because it is a database application and testing it against
# anything else would be pretence.
#
# Each step that needs code runs only once that code exists, because the build
# arrives one slice at a time.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # python-ldap has no wheel: it is built here, and its build needs the
      # OpenLDAP and Cyrus SASL headers. The package that carries the OpenLDAP
      # ones was renamed, so both names are offered and whichever the runner
      # knows is taken.
      - name: Install the headers python-ldap builds against
        if: hashFiles('app/requirements-dev.txt') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev
          sudo apt-get install -y libldap-dev || sudo apt-get install -y libldap2-dev

      - name: Install what the checks need
        run: |
          for file in whisperx-service/requirements-dev.txt app/requirements-dev.txt; do
            if [ -f "$file" ]; then pip install -r "$file"; fi
          done

      - name: Lint (ruff)
        if: hashFiles('**/*.py') != ''
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        if: hashFiles('whisperx-service/tests/**', 'app/tests/**') != ''
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        run: python -m pytest

      - name: The WhisperX service's compose file is valid
        if: hashFiles('whisperx-service/compose.yaml') != ''
        run: |
          cp whisperx-service/.env.example whisperx-service/.env
          mkdir -p whisperx-service/secrets
          : > whisperx-service/secrets/hf_token
          : > whisperx-service/secrets/tokens
          docker compose -f whisperx-service/compose.yaml config --quiet

      - name: The whole stack's compose file is valid
        if: hashFiles('compose.yaml') != ''
        run: |
          cp .env.example .env
          mkdir -p secrets
          : > secrets/django_secret_key
          : > secrets/postgres_password
          : > secrets/whisperx_consumer_token
          docker compose config --quiet
          rm -rf .env secrets whisperx-service/.env whisperx-service/secrets

      - name: The Caddyfile asks before it serves
        if: hashFiles('caddy/Caddyfile') != ''
        # A Caddyfile is not run in the order it is written: Caddy sorts the
        # directives inside a handle block into its own order. That once put
        # the strip_prefix ahead of the forward_auth, so the app was asked
        # about a path it did not recognise and every recording in the office
        # was refused, silently. This adapts the file the way Caddy does and
        # fails if the media route ever serves a file before it has asked.
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/caddy:/etc/caddy:ro"             -e APP_HOSTNAME=example.internal -e ALLOWED_CLIENT_CIDRS=10.0.0.0/8             caddy:2.11-alpine caddy adapt --config /etc/caddy/Caddyfile             > /tmp/caddy.json
          python3 - <<'CHECK'
          import json
          import sys

          config = json.load(open("/tmp/caddy.json"))
          routes = config["apps"]["http"]["servers"]["srv0"]["routes"]

          # Both roots: the Workspace's under scratch/ and a Case's under
          # cases/. Each has to ask before it serves, and a route that stops
          # existing has to be noticed, so both are required to be found.
          WANTED = ["/media/*", "/case-media/*"]

          def handlers(routes, wanted, found=False):
              for route in routes:
                  mine = any(
                      wanted in one.get("path", [])
                      for one in route.get("match", [])
                  )
                  for handler in route.get("handle", []):
                      if handler.get("handler") == "subroute":
                          yield from handlers(
                              handler["routes"], wanted, found or mine
                          )
                      elif found or mine:
                          yield handler

          for wanted in WANTED:
              order = [one.get("handler") for one in handlers(routes, wanted)]
              print(wanted, "runs:", order)

              if "file_server" not in order:
                  sys.exit(f"{wanted} serves no files at all")
              asks = order.index("reverse_proxy") if "reverse_proxy" in order else -1
              serves = order.index("file_server")
              if asks < 0 or asks > serves:
                  sys.exit(f"{wanted} serves files before it asks the app: {order}")
              print(wanted, "asks before it serves.")
          CHECK

      # Adapting the file proves the order of the directives. It does not
      # prove that a browser can jump about in a recording, which needs the
      # route actually run: a server that answers the whole file to a request
      # for a hundred bytes plays a video and cannot scrub it, and looks from
      # the page like a broken page.
      - name: A browser can jump about in a recording
        if: hashFiles('caddy/Caddyfile') != ''
        run: bash ./caddy/check-ranges.sh

      - name: Secret scan (gitleaks)
        # The gitleaks command-line tool is MIT and needs no licence key. The
        # gitleaks GitHub Action is not used: since its version 2 it needs a
        # key for organisation accounts. The image tag is pinned at the first
        # public Release, as everything else in this repository is.
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:latest dir /repo --redact --verbose
