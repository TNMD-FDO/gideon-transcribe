# Tool settings for every Python folder in this repository: the WhisperX
# service now, and the app when it arrives. There is no package to build here;
# each image installs what it needs from its own requirements files.

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Pyflakes and pycodestyle for the ordinary mistakes, isort for import order,
# pyupgrade for syntax that has moved on, bugbear and simplify for the traps
# that are easy to read past.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# Each side imports the way its own container does: the service imports
# `service`, the app imports `transcribe` and `core`.
pythonpath = ["whisperx-service", "app"]
testpaths = ["whisperx-service/tests", "app/tests"]
addopts = "-q"
DJANGO_SETTINGS_MODULE = "transcribe.settings_test"

[tool.ruff.lint.per-file-ignores]
# FastAPI declares where a value comes from in the argument default, which is
# the framework's own idiom and not the mistake this rule looks for.
"whisperx-service/service/api.py" = ["B008"]
# Django writes its own migrations, and they are a record of what was done
# rather than code anybody reads. Reformatting them by hand would make them
# disagree with what Django writes next time.
"app/core/migrations/*" = ["E501"]
